<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point Hub</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #f5f5f5; color: #333; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; text-align: center; }
    .points { font-size: 3rem; font-weight: bold; color: #6200ee; margin: 1rem 0; }
    button { padding: 8px 16px; border: none; background: #6200ee; color: white; border-radius: 6px; cursor: pointer; margin: 4px; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="card">
    <h2>現在の保有ポイント</h2>
    <div class="points" id="point-display">0</div>
    <div>
      <button onclick="addPoints(100)">+100pt獲得</button>
      <button onclick="addPoints(-50)">-50pt使用</button>
      <button onclick="resetPoints()">リセット</button>
    </div>
  </div>

  <script src="./points.js"></script>
  <script>
    const display = document.getElementById('point-display');

    function updateUI(points) {
      display.textContent = points.toLocaleString();
    }

    // 初期ロード時にポイント表示
    updateUI(PointsSystem.get());

    // ポイントが変更されたら画面を自動更新
    PointsSystem.onChange((newPoints) => {
      updateUI(newPoints);
    });

    function addPoints(amount) {
      PointsSystem.add(amount);
    }

    function resetPoints() {
      PointsSystem.set(0);
    }
  </script>
</body>
</html>

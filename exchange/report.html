<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>バグ報告 | PB Park</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{--blue:#3381ff;--blue-dark:#1a5fcc;--ink:#10243a;--muted:#587087;--card:rgba(255,255,255,.8)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:'Plus Jakarta Sans','Noto Sans JP',sans-serif;color:var(--ink);background:linear-gradient(160deg,#318ff0 0%,#9ddaff 54%,#d9f4ff 100%);padding:20px 16px 40px}.wrap{width:min(100%,600px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin:4px 4px 18px}.logo{font-weight:800;font-size:17px}.logo span{font-size:10px;background:#fff;color:var(--blue-dark);padding:4px 8px;border-radius:8px;margin-left:5px}.back{color:#fff;text-decoration:none;font-size:12px;font-weight:700}.card{background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.45);border-radius:26px;padding:24px;box-shadow:0 12px 34px rgba(16,58,96,.16);margin-bottom:16px}.hero{color:#fff;background:radial-gradient(circle at 90% 0,rgba(255,255,255,.4),transparent 45%),linear-gradient(145deg,var(--blue),var(--blue-dark))}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.9}.hero h1{font-size:30px;line-height:1.25;margin:12px 0 8px;font-weight:900}.hero p{color:rgba(255,255,255,.9)}p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 14px}h2{font-size:18px;margin:0 0 8px}.label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}.required{color:#d52d4b;margin-left:4px;font-size:10px}input,select,textarea{width:100%;border:1px solid rgba(16,36,58,.16);background:rgba(255,255,255,.88);border-radius:15px;padding:13px 14px;font:500 14px/1.55 inherit;color:var(--ink);outline:none}textarea{min-height:110px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(51,129,255,.16)}button{width:100%;border:0;border-radius:15px;padding:15px 18px;margin-top:18px;background:var(--blue);color:#fff;font:800 14px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hint{font-size:11px;margin:6px 1px 0;color:var(--muted)}.check{display:flex;gap:9px;align-items:flex-start;margin-top:17px;font-size:12px;line-height:1.5;color:var(--muted)}.check input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--blue)}.notice{display:none;border-radius:15px;padding:14px 15px;margin-top:14px;font-size:13px;font-weight:700;line-height:1.55}.notice.show{display:block}.notice.ok{background:#d9f7e7;color:#12633b}.notice.bad{background:#ffe2e2;color:#9c2020}.note{background:rgba(51,129,255,.1);border-radius:15px;padding:13px 14px;font-size:12px;line-height:1.6;color:var(--muted)}.foot{text-align:center;color:rgba(255,255,255,.86);font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">PB Park <span>BUG REPORT</span></div><a class="back" href="/pbpark/">ホームへ</a></div>
  <section class="card hero"><div class="eyebrow">HELP PB PARK GROW</div><h1>バグを見つけたら<br>教えてね！</h1><p>うまく説明できなくても大丈夫。小さな違和感も、PBParkをよくする大事なヒントです。</p></section>
  <form class="card" id="report-form" action="https://script.google.com/macros/s/AKfycbzCK3KxACAzhjXDtY-R_TIm415hkgoCzwDotmE-nrwWMch1hqcHKlWvWmOUmLvTn9bL/exec" method="post" target="submit-frame">
    <h2>バグ報告フォーム</h2><p>必須項目は3つだけです。分かる範囲で書いてください。</p>
    <label class="label" for="page">どのページ・アプリ？<span class="required">必須</span></label>
    <input id="page" name="page" required maxlength="200" placeholder="例：PBチェス4、PBPoint、トップページ">
    <label class="label" for="title">バグのタイトル<span class="required">必須</span></label>
    <input id="title" name="title" required maxlength="200" placeholder="例：スマホで対戦ボタンが押せない">
    <label class="label" for="detail">何をすると起きましたか？<span class="required">必須</span></label>
    <textarea id="detail" name="detail" required maxlength="5000" placeholder="例：ゲームを開いて、対戦ボタンを押しました。"></textarea>
    <label class="label" for="expected">本来どうなってほしかった？</label>
    <textarea id="expected" name="expected" maxlength="3000" placeholder="例：対戦相手を探し始めてほしい。"></textarea>
    <label class="label" for="actual">実際にはどうなりましたか？</label>
    <textarea id="actual" name="actual" maxlength="3000" placeholder="例：ボタンの色が変わるだけで何も起きなかった。"></textarea>
    <label class="label" for="environment">端末・ブラウザ</label>
    <input id="environment" name="environment" maxlength="300" placeholder="例：Android / Chrome">
    <label class="label" for="image">スクリーンショットのURL</label>
    <input id="image" name="image" type="url" maxlength="1000" placeholder="なくてもOK">
    <p class="hint">画像を添付できない場合は空欄で大丈夫です。</p>
    <label class="label" for="name">ニックネーム</label>
    <input id="name" name="name" maxlength="80" placeholder="匿名でもOK">
    <label class="label" for="email">メールアドレス</label>
    <input id="email" name="email" type="email" maxlength="254" placeholder="修正後にPBPointのIDを受け取りたい人だけ">
    <p class="hint">修正後のお知らせとプレゼントIDが必要な場合だけ入力してください。</p>
    <label class="check"><input type="checkbox" name="reward_agree" value="同意" required><span>この報告が修正された場合、入力したメールアドレスにプレゼントIDが届くことに同意します。メールアドレスを入力していない場合は連絡できません。</span></label>
    <div class="note" style="margin-top:16px">送信後、運営が内容を確認します。すぐに修正できない場合や、すでに知られているバグの場合もあります。</div>
    <button id="submit" type="submit"><span class="material-symbols-outlined" style="vertical-align:-5px;font-size:19px">send</span> バグを送信する</button>
    <div id="notice" class="notice" role="status"></div>
  </form>
  <iframe name="submit-frame" id="submit-frame" title="送信処理" hidden></iframe>
  <div class="foot">PB Park · みんなで見つけて、みんなでよくする。</div>
</div>
<script>
const form=document.getElementById('report-form'),button=document.getElementById('submit'),notice=document.getElementById('notice'),frame=document.getElementById('submit-frame');
function show(text,ok){notice.textContent=text;notice.className='notice show '+(ok?'ok':'bad')}
form.addEventListener('submit',()=>{button.disabled=true;button.textContent='送信しています…';show('報告を送信しています…',true)});
frame.addEventListener('load',()=>{if(!button.disabled)return;form.reset();button.disabled=false;button.innerHTML='<span class="material-symbols-outlined" style="vertical-align:-5px;font-size:19px">send</span> バグを送信する';show('報告ありがとう！運営に届きました。修正されたら、入力したメールアドレスへプレゼントIDを送ります。',true);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});
</script>
</body>
</html>

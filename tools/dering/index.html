<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>輪!ドイツ! Ring! Deutschland!</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            color: #ffffff;
        }

        /* 3D Bird's View: 傾けても黒い縁が出ない最小限のサイズ(JSで計算) */
        #viewport-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            perspective: 1200px;
            background: linear-gradient(#bfdbfe, #e0f2fe);
        }

        #map-oversized-wrapper {
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.45s ease;
        }

        #leaflet-map {
            width: 100%;
            height: 100%;
            background: #1a202c;
        }

        /* Disable Leaflet default UI elements we don't need */
        .leaflet-control-container .leaflet-top,
        .leaflet-control-container .leaflet-bottom {
            display: none !important;
        }

        /* Custom Ball Marker Styles */
        .ball-marker-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ball-img-wrapper {
            width: 64px;
            height: 64px;
            position: relative;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.4));
            animation: bounce 2s infinite ease-in-out;
        }

        .ball-img-wrapper canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .ball-shadow {
            width: 48px;
            height: 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            margin-top: -6px;
            transform: scaleY(0.5);
            animation: shadow-scale 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes shadow-scale {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(0.7); opacity: 0.3; }
        }

        /* Floating background balls for Start Screen */
        .floating-ball {
            position: absolute;
            pointer-events: none;
            animation: floatAround 12s infinite ease-in-out;
            opacity: 0.85;
        }

        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(15deg); }
            66% { transform: translate(-20px, 40px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* DE-Ring Styling (Germany Flag Gradient) */
        .de-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 14px solid transparent;
            background: linear-gradient(#000, #000) padding-box,
                        linear-gradient(135deg, #000000 0%, #dd0000 50%, #ffcc00 100%) border-box;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.6), inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        /* Speech Bubble Style */
        .speech-bubble {
            position: absolute;
            bottom: 75px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a202c;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #dd0000;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #dd0000 transparent;
            display: block;
            width: 0;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Pulse ring around player */
        .player-pulse {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid #ffcc00;
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
        }

        /* ---- 追加: ボールの見え方 / 正面向き / HUD ---- */
        .upright {
            transform: rotate(calc(var(--hd, 0deg) * -1)) scaleY(1.55);
            transform-origin: 50% 100%;
            transition: transform 0.45s ease;
        }
        .ball-leaflet-icon.state-hidden { visibility: hidden !important; pointer-events: none !important; }
        .ball-leaflet-icon.state-hint .ball-img-wrapper canvas { filter: brightness(0) opacity(0.45); }
        .ball-q {
            display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
            font-weight: 900; font-size: 30px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .ball-leaflet-icon.state-hint .ball-q { display: flex; }
        #fog-top {
            position: absolute; top: 0; left: 0; right: 0; height: 34%; z-index: 5; pointer-events: none;
            background: linear-gradient(to bottom, #bfdbfe 0%, rgba(191,219,254,0.92) 12%, rgba(224,242,254,0.55) 28%, rgba(224,242,254,0) 100%);
        }
        #toast { animation: toastIn 0.25s ease-out; }
        @keyframes toastIn { from { opacity: 0; } to { opacity: 1; } }
        .dp { height: 40px; background: rgba(255,255,255,0.95); border-radius: 12px; font-weight: 900; color: #334155; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .dp:active { transform: scale(0.92); }
        #ring-touch-area { touch-action: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
    
        /* ---- dialog / shell ---- */
        .m3-scrim { position: fixed; inset: 0; z-index: 99990; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-family: Roboto, "Google Sans", system-ui, sans-serif; }
        .m3-dialog { background: #ece6f0; border-radius: 28px; padding: 24px; width: min(86vw, 320px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
        .m3-title { font-size: 24px; line-height: 32px; color: #1d1b20; margin: 0 0 16px; font-weight: 400; }
        .m3-body { font-size: 14px; line-height: 20px; color: #49454f; margin: 0 0 24px; }
        .m3-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .m3-btn { background: none; border: 0; color: #6750a4; font: 500 14px Roboto, system-ui, sans-serif; padding: 10px 12px; border-radius: 20px; cursor: pointer; }
        .m3-btn:active { background: rgba(103,80,164,0.12); }
        #sh-root { position: fixed; inset: 0; z-index: 99999; background: #000; color: #cfcfcf; opacity: 0; transition: opacity 0.8s; overflow: hidden; }
        #sh-boot { height: 100%; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; }
        #sh-boot img { width: 48px; height: 48px; margin-bottom: 8px; flex-shrink: 0; }
        #sh-boot .sh-log { flex: 1; overflow: hidden; white-space: pre-wrap; word-break: break-all; }
        #twm { position: absolute; inset: 0; background: #6c7b8b; font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #000; user-select: none; -webkit-user-select: none; touch-action: none; }
        .twm-win { position: absolute; background: #b0c4de; border: 1px solid #000; display: flex; flex-direction: column; box-shadow: 2px 2px 0 rgba(0,0,0,0.35); }
        .twm-title { background: #fff; border-bottom: 1px solid #000; height: 22px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; cursor: move; touch-action: none; font-weight: 700; font-size: 12px; }
        .twm-x { width: 16px; height: 16px; border: 1px solid #000; background: #b0c4de; line-height: 13px; text-align: center; cursor: pointer; font-size: 12px; }
        .twm-body { padding: 6px; overflow: auto; flex: 1; min-height: 0; }
        .twm-menu { position: absolute; z-index: 5000; border: 1px solid #000; background: #b0c4de; min-width: 120px; }
        .twm-menu .t { background: #fff; border-bottom: 1px solid #000; text-align: center; padding: 2px 8px; font-weight: 700; }
        .twm-menu .i { padding: 3px 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; }
        .twm-menu .i:active, .twm-menu .i.on { background: #000; color: #fff; }
        .twm-menu .mk { width: 9px; height: 9px; border: 1px solid currentColor; }
        .twm-row { padding: 3px 4px; cursor: pointer; font-family: ui-monospace, monospace; }
        .twm-row:active { background: #000; color: #fff; }
        .twm-win textarea { width: 100%; box-sizing: border-box; border: 1px solid #000; background: #fff; font: 12px/1.4 ui-monospace, monospace; resize: none; }
        .twm-btn { border: 1px solid #000; background: #fff; padding: 2px 10px; font: 12px sans-serif; cursor: pointer; }

        /* ---- 付近のボール ---- */
        .nb-backdrop { position: fixed; inset: 0; z-index: 800; background: rgba(0,0,0,0.35); display: none; align-items: flex-end; justify-content: center; }
        .nb-panel { width: min(100%, 480px); max-height: 72vh; background: #fff; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 24px rgba(0,0,0,0.2); }
        .nb-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; font-weight: 900; color: #334155; border-bottom: 1px solid #e2e8f0; }
        .nb-close { border: 0; background: #f1f5f9; border-radius: 50%; width: 32px; height: 32px; font-weight: 900; color: #475569; }
        .nb-list { overflow: auto; padding: 8px 12px 16px; }
        .nb-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; }
        .nb-row:nth-child(odd) { background: #f8fafc; }
        .nb-ball { width: 56px; height: 56px; flex-shrink: 0; }
        .nb-ball canvas { width: 100%; height: 100%; display: block; }
        .nb-dark .nb-ball canvas { filter: brightness(0.55) saturate(0.7); }
        .nb-name { font-weight: 900; color: #1e293b; }
        .nb-sub { font-size: 12px; color: #64748b; }
        .nb-empty { padding: 24px; text-align: center; color: #64748b; font-weight: 700; line-height: 1.6; }
        .nb-hint { padding: 8px 18px 0; font-size: 11px; color: #94a3b8; font-weight: 700; }
        .mk-chip { background: rgba(255,255,255,0.95); border: 1px solid #fecaca; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 800; color: #b91c1c; box-shadow: 0 2px 8px rgba(0,0,0,0.15); align-self: flex-start; }
</style>
</head>
<body class="bg-slate-950 text-white select-none overflow-hidden">

    <!-- MAIN CONTAINER -->
    <div id="app" class="relative w-full h-full">

        <!-- START SCREEN -->
        <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-between p-6 bg-gradient-to-b from-slate-900 via-zinc-900 to-black overflow-hidden">
            <!-- Floating Background Balls Container -->
            <div id="floating-balls-bg" class="absolute inset-0 pointer-events-none z-0"></div>

            <div class="relative z-10 text-center mt-12">
                <div class="inline-block px-4 py-1 bg-yellow-400 text-black font-extrabold rounded-full text-xs tracking-widest mb-3 shadow-lg uppercase">
                    GPS Location Game
                </div>
                <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-amber-300 drop-shadow-md">
                    輪!ドイツ!
                </h1>
                <p class="text-lg md:text-xl font-bold text-gray-300 mt-1 tracking-wider">
                    Ring! Deutschland!
                </p>
                <p class="text-xs text-gray-400 mt-2 max-w-xs mx-auto">
                    ドイツの街や道路に現れるポーランドボールたちをDE-Ringでゲットしよう！
                </p>
            </div>

            <!-- Start Image Centerpiece -->
            <div class="relative z-10 my-auto flex flex-col items-center">
                <div class="relative w-40 h-40 flex items-center justify-center">
                    <div class="de-ring animate-spin" style="animation-duration: 15s;"></div>
                    <canvas id="start-ball" width="220" height="220" class="absolute w-24 h-24 drop-shadow-2xl"></canvas>
                </div>
            </div>

            <!-- Start Action Button -->
            <div class="relative z-10 w-full max-w-xs mb-8">
                <button id="btn-start" class="w-full py-4 bg-gradient-to-r from-yellow-400 via-red-500 to-black text-white font-black text-xl rounded-2xl shadow-2xl border-2 border-yellow-300 hover:scale-105 active:scale-95 transition transform flex items-center justify-center gap-3">
                    <i class="fa-solid font-bold fa-location-dot text-yellow-300"></i>
                    <span>冒険をはじめる！</span>
                </button>
                <p class="text-[10px] text-center text-gray-400 mt-3">※位置情報(GPS)を使用します</p>
            </div>
        </div>

        <!-- 3D MAP SCREEN -->
        <div id="map-screen" class="absolute inset-0 z-10 hidden">
            <!-- 3D Perspective Viewport -->
            <div id="viewport-container">
                <div id="map-oversized-wrapper">
                    <div id="leaflet-map"></div>
                </div>
            </div>

            <div id="fog-top"></div>

            <!-- 現在地さがし中 -->
            <div id="loading-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center gap-3 bg-sky-100/95 text-slate-700 p-6 text-center">
                <div class="text-5xl animate-bounce">🧭</div>
                <p id="loading-msg" class="font-black text-lg">現在地をさがしているよ…</p>
                <p class="text-xs text-slate-500">位置情報の許可を求められたら「許可」してね</p>
                <div id="loading-actions" class="hidden flex flex-col gap-2 w-full max-w-xs mt-2">
                    <button id="btn-retry" class="py-3 rounded-2xl bg-amber-400 text-slate-900 font-black shadow">もう一度さがす</button>
                    <button id="btn-demo" class="py-3 rounded-2xl bg-white text-slate-700 font-bold border border-slate-200 shadow">デモ(ベルリン)であそぶ</button>
                </div>
            </div>

            <!-- トースト -->
            <div id="toast" class="hidden absolute top-20 left-1/2 -translate-x-1/2 z-30 max-w-[90%] bg-slate-900/90 text-white text-sm font-bold px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 pointer-events-none"></div>

            <button id="btn-nearby" class="absolute left-4 top-24 z-20 bg-white/95 border border-slate-200 rounded-2xl shadow-xl px-3 py-2 text-sm font-black text-slate-700 flex items-center gap-1.5"><i class="fa-solid fa-location-crosshairs text-amber-500"></i>付近のボール</button>

            <div id="mark-chips" class="absolute left-4 top-36 z-20 flex flex-col gap-1 pointer-events-none"></div>

            <!-- MAP HUD TOP BAR -->
            <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-auto">
                <!-- Status Badge -->
                <div class="bg-white/95 backdrop-blur border border-slate-200 rounded-2xl px-4 py-2 flex items-center gap-3 shadow-xl">
                    <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold tracking-wider">📍 げんざい地</div>
                        <div id="gps-status" class="text-xs font-bold text-slate-700">GPSをさがし中…</div>
                    </div>
                </div>

                <!-- Collection Zukan Button -->
                <button id="btn-open-zukan" class="bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 font-black px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 border border-yellow-300 active:scale-95 transition">
                    <i class="fa-solid fa-book-bookmark text-lg"></i>
                    <span class="text-sm">図鑑</span>
                    <span id="zukan-count-badge" class="bg-black text-yellow-400 text-xs px-2 py-0.5 rounded-full ml-1">0/0</span>
                </button>
            </div>

            <!-- MAP CONTROLS (ROTATION & ZOOM) RIGHT SIDE -->
            <div class="absolute right-4 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-3 pointer-events-auto">
                <button id="btn-zoom-in" class="w-12 h-12 bg-white/95 border border-slate-200 rounded-2xl text-slate-700 font-bold flex items-center justify-center shadow-xl active:scale-95 text-xl">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="btn-zoom-out" class="w-12 h-12 bg-white/95 border border-slate-200 rounded-2xl text-slate-700 font-bold flex items-center justify-center shadow-xl active:scale-95 text-xl">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <button id="btn-rotate-left" class="w-12 h-12 bg-white/95 border border-slate-200 rounded-2xl text-amber-600 font-bold flex items-center justify-center shadow-xl active:scale-95">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button id="btn-rotate-right" class="w-12 h-12 bg-white/95 border border-slate-200 rounded-2xl text-amber-600 font-bold flex items-center justify-center shadow-xl active:scale-95">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- ボールのけはい(あったかメーター) -->
            <div class="absolute bottom-6 left-4 right-4 z-20 flex justify-center pointer-events-none">
                <div id="radar-card" class="w-full max-w-sm bg-white/95 border border-slate-200 rounded-3xl shadow-xl px-4 py-3 pointer-events-auto">
                    <div class="flex items-center gap-3">
                        <div id="radar-icon" class="text-3xl">🧭</div>
                        <div class="flex-1 min-w-0">
                            <div class="text-[10px] font-bold text-slate-400 tracking-wider">ボールのけはい</div>
                            <div id="radar-msg" class="text-sm font-black text-slate-800 leading-snug">さがしています…</div>
                        </div>
                    </div>
                    <div class="mt-2 h-2.5 rounded-full bg-slate-200 overflow-hidden">
                        <div id="radar-bar" class="h-full rounded-full bg-gradient-to-r from-sky-400 via-amber-400 to-red-500 transition-all duration-500" style="width:0%"></div>
                    </div>
                </div>
            </div>

            <!-- デモモード用 十字ボタン -->
            <div id="dpad" class="hidden absolute left-4 bottom-40 z-20 grid grid-cols-3 gap-1 w-32 pointer-events-auto">
                <span></span><button data-d="0,1" class="dp">▲</button><span></span>
                <button data-d="-1,0" class="dp">◀</button><span></span><button data-d="1,0" class="dp">▶</button>
                <span></span><button data-d="0,-1" class="dp">▼</button><span></span>
            </div>
        </div>

        <!-- RING THROW GAME OVERLAY -->
        <div id="throw-screen" class="absolute inset-0 z-40 hidden bg-gradient-to-b from-slate-950 via-zinc-900 to-slate-950 flex flex-col justify-between items-center p-6">
            <!-- Header Info -->
            <div class="w-full flex justify-between items-center z-10">
                <button id="btn-close-throw" class="w-10 h-10 bg-slate-800 border border-slate-600 rounded-full text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="text-center">
                    <span id="target-country-name" class="text-xs font-bold text-yellow-400 tracking-widest uppercase">ドイツボール</span>
                    <h2 id="target-ball-title" class="text-xl font-black text-white">野生のボールが現れた！</h2>
                    <div id="throw-stars" class="text-xs font-bold text-amber-300 mt-0.5"></div>
                </div>
                <div class="w-10"></div>
            </div>

            <!-- Target Area (Ball Floating) -->
            <div id="target-area" class="relative w-full h-64 flex items-center justify-center my-auto">
                <div id="target-band" class="absolute top-2 bottom-2 left-1/2 -translate-x-1/2 border-x-2 border-dashed border-yellow-300/70 bg-yellow-300/10 rounded-xl pointer-events-none" style="width:100px"></div>
                <div id="target-ball-box" class="relative flex flex-col items-center">
                    <div id="target-img-container" class="w-36 h-36 relative transition-transform duration-300">
                        <canvas id="target-ball-canvas" width="220" height="220" class="w-full h-full drop-shadow-2xl"></canvas>
                    </div>
                    <!-- Catch Status Message Overlay -->
                    <div id="catch-msg" class="absolute -bottom-10 bg-yellow-400 text-black font-black px-4 py-1.5 rounded-full text-sm shadow-xl hidden animate-bounce">
                        ゲット成功！
                    </div>
                    <div id="miss-msg" class="absolute -bottom-10 bg-red-600 text-white font-black px-4 py-1.5 rounded-full text-sm shadow-xl hidden">
                        おしい！ハズレ！
                    </div>
                </div>
            </div>

            <!-- Throw Controls & Canvas Container -->
            <div class="w-full flex flex-col items-center mb-6 z-10 gap-4">
                <p id="throw-hint" class="text-xs font-bold text-gray-300 bg-slate-800/80 px-4 py-1.5 rounded-full border border-slate-700">
                    ボールが点線の中に来たら、リングを上へスワイプ！(タップでもOK)
                </p>

                <!-- Throwing Ring Visual / Drag Area -->
                <div id="ring-touch-area" class="relative w-48 h-48 flex items-center justify-center cursor-grab active:cursor-grabbing">
                    <div id="throw-ring" class="de-ring transition-transform duration-75"></div>
                </div>
            </div>
        </div>

        <!-- ZUKAN (ENCYCLOPEDIA) MODAL -->
        <div id="zukan-modal" class="absolute inset-0 z-50 hidden bg-slate-950/95 backdrop-blur-md flex flex-col">
            <!-- Zukan Header -->
            <div class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-black text-yellow-400 flex items-center gap-2">

            { id: 'oceania', name: 'オセアニア', list: 'au:オーストラリア,fj:フィジー,ki:キリバス,mh:マーシャル諸島,fm:ミクロネシア連邦,nr:ナウル,nz:ニュージーランド,pw:パラオ,pg:パプアニューギニア,ws:サモア,sb:ソロモン諸島,to:トンガ,tv:ツバル,vu:バヌアツ' }

        const COUNTRIES = [];

        /* =================================================================
           1b. カントリーボール作成システム: frame.png(体の枠) + 旗(枠の内側) + eye.png(目)
               ※ 描画によるフォールバックは無し。PNG素材が読めない場合は表示せず通知する
           ================================================================= */
        const ASSET = 'https://raw.githubusercontent.com/PolandBallHub-Operator/pbpark/refs/heads/main/AI/historyai/';
        function loadImg(src, cors) {
            return new Promise(res => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
        }
        // 透明領域を連結成分に分け、外側(画像の端につながる領域)と内側(閉じた領域)を見分ける
        function emptyComponents(img, size) {
            const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'); x.drawImage(img, 0, 0, size, size);
            const d = x.getImageData(0, 0, size, size).data, N = size * size, label = new Int32Array(N).fill(-1), comps = [];
            for (let s = 0; s < N; s++) {
                if (label[s] !== -1 || d[s * 4 + 3] >= 40) continue;
                const id = comps.length, stack = [s]; label[s] = id; let area = 0, sx = 0, sy = 0, edge = false, minX = size, maxX = 0, minY = size, maxY = 0;
                while (stack.length) {
                    const p = stack.pop(), px = p % size, py = (p / size) | 0; area++; sx += px; sy += py;
                    if (px === 0 || py === 0 || px === size - 1 || py === size - 1) edge = true;
                    if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py;
                    for (const q of [p - 1, p + 1, p - size, p + size]) {
                        if (q < 0 || q >= N) continue; if ((q === p - 1 && px === 0) || (q === p + 1 && px === size - 1)) continue;
                        if (label[q] === -1 && d[q * 4 + 3] < 40) { label[q] = id; stack.push(q); }
                    }
                }
                comps.push({ id, area, cx: sx / area, cy: sy / area, edge, minX, maxX, minY, maxY });
            }
            return { label, comps, size };
        }
        const EYE_FILES = { normal: 'eye.png', anger: 'anger.png', lol: 'lol.png', sad: 'sad.png', smile: 'smile.png' };
        function buildEyeCanvas(img, S) {
            // 目: 内側の閉じた領域を白で塗る
            const ec = emptyComponents(img, S), eyes = ec.comps.filter(c => !c.edge && c.area > 80).sort((a, b) => a.cx - b.cx).slice(0, 2);
            const ids = new Set(eyes.map(e => e.id));
            const cv = document.createElement('canvas'); cv.width = cv.height = S; const x = cv.getContext('2d'), d = x.createImageData(S, S);
            for (let i = 0; i < S * S; i++) { if (ids.has(ec.label[i])) { d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = 255; d.data[i * 4 + 3] = 255; } }
            x.putImageData(d, 0, 0); x.drawImage(img, 0, 0, S, S);
            return cv;
        }
        async function loadAssets() {
            const names = Object.keys(EYE_FILES);
            const [frame, ...eyeImgs] = await Promise.all([loadImg(ASSET + 'frame.png', true), ...names.map(n => loadImg(ASSET + EYE_FILES[n], true))]);
            const A = { frame, size: 220, ok: false, eyes: {} };
            if (!frame || !eyeImgs[0]) return A;
            try {
                const S = A.size;
                // 体マスク = 枠の外側以外(枠の線と内側)
                const fc = emptyComponents(frame, S), outside = new Set(fc.comps.filter(c => c.edge).map(c => c.id));
                const mask = document.createElement('canvas'); mask.width = mask.height = S; const mx = mask.getContext('2d'), md = mx.createImageData(S, S);
                let minX = S, maxX = 0, minY = S, maxY = 0;
                for (let i = 0; i < S * S; i++) {
                    if (!outside.has(fc.label[i])) { md.data[i * 4 + 3] = 255; const px = i % S, py = (i / S) | 0; if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py; }
                }
                mx.putImageData(md, 0, 0); A.mask = mask; A.body = { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
                names.forEach((n, i) => { if (eyeImgs[i]) { try { A.eyes[n] = buildEyeCanvas(eyeImgs[i], S); } catch (e) { console.warn(n, e); } } });
                A.ok = !!A.eyes.normal;
            } catch (e) { console.warn('ball asset analysis failed', e); }
            return A;
        }
        let assetsPromise = null, assetErrShown = false, assetsA = null;
        function getAssets() {
            if (assetsPromise) return assetsPromise;
            const p = loadAssets(); assetsPromise = p;
            p.then(A => { if (A.ok) assetsA = A; else if (assetsPromise === p) assetsPromise = null; }); // 失敗時は次回再試行
            return p;
        }
        function paintFlag(ctx, flag, box) {
            const { x, y, w, h } = box;
            if (flag === 'poland') { // ポーランドボールは上下が逆(赤が上)
                ctx.fillStyle = '#DC143C'; ctx.fillRect(x, y, w, h / 2); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y + h / 2, w, h / 2); return;
            }
            if (!flag) { ctx.fillStyle = '#C9CDD2'; ctx.fillRect(x, y, w, h); return; } // 旗の取得中は灰色
            const s = Math.max(w / flag.naturalWidth, h / flag.naturalHeight), dw = flag.naturalWidth * s, dh = flag.naturalHeight * s;
            ctx.drawImage(flag, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
        }
        const tmpFlag = document.createElement('canvas'), tmpEye = document.createElement('canvas');
        tmpFlag.width = tmpFlag.height = tmpEye.width = tmpEye.height = 220;
        // lx, ly: -1〜1 の視線。目と旗を少しずらして「振り返る」動きにする
        function renderBall(canvas, A, flag, expr, lx, ly) {
            const S = 220; if (canvas.width !== S) canvas.width = S; if (canvas.height !== S) canvas.height = S;
            lx = lx || 0; ly = ly || 0;
            const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, S, S);
            const fx = tmpFlag.getContext('2d'); fx.globalCompositeOperation = 'source-over'; fx.clearRect(0, 0, S, S);
            paintFlag(fx, flag, { x: A.body.x - 12 + lx * 9, y: A.body.y, w: A.body.w + 24, h: A.body.h });
            fx.globalCompositeOperation = 'destination-in'; fx.drawImage(A.mask, 0, 0); // 旗を体の形に切り抜き
            ctx.drawImage(tmpFlag, 0, 0); ctx.drawImage(A.frame, 0, 0, S, S);
            const ex = tmpEye.getContext('2d'); ex.globalCompositeOperation = 'source-over'; ex.clearRect(0, 0, S, S);
            ex.drawImage(A.eyes[expr] || A.eyes.normal, lx * 11, ly * 7);
            ex.globalCompositeOperation = 'destination-in'; ex.drawImage(A.mask, 0, 0);
            ctx.drawImage(tmpEye, 0, 0);
        }

        /* 国旗の取得: flagcdn → 日本語版Wikipedia の順 */
        const flagImgs = new Map(), flagTasks = new Map();
        async function wikiThumb(host, title) {
            const url = `https://${host}/w/api.php?action=query&prop=pageimages&redirects=1&titles=${encodeURIComponent(title)}&format=json&pithumbsize=400&origin=*`;
            const r = await fetch(url); if (!r.ok) return null; const d = await r.json(), pages = d.query && d.query.pages; if (!pages) return null;
            const p = pages[Object.keys(pages)[0]]; return p && p.thumbnail ? p.thumbnail.source : null;
        }
        function getFlag(c) {
            if (c.id === 'pl') return Promise.resolve('poland');
            if (flagTasks.has(c.id)) return flagTasks.get(c.id);
            const p = (async () => {
                if (c.custom) {
                    if (c.flagUrl) { const u = await loadImg(c.flagUrl, true) || await loadImg(c.flagUrl, false); if (u) return u; }
                } else {
                    const a = await loadImg(`https://flagcdn.com/w320/${c.id}.png`, true); if (a) return a;
                }
                try { const u = await wikiThumb('ja.wikipedia.org', `${c.name}の国旗`); if (u) { const b = await loadImg(u, true); if (b) return b; } } catch (e) { /* 取得できなければ灰色のまま */ }
                return null;
            })();
            p.then(f => { if (!f) flagTasks.delete(c.id); });
            flagTasks.set(c.id, p); return p;
        }

        /* canvas にその国のボールを描く。canvas._pb に表情・視線の状態を保持 */
        const EXPRS = ['normal', 'anger', 'lol', 'sad', 'smile'];
        const EXPR_WEIGHTS = [['normal', 60], ['smile', 15], ['lol', 10], ['sad', 8], ['anger', 7]];
        const liveBalls = new Set();
        function refreshBall(canvas) {
            const s = canvas._pb; if (!s || !assetsA) return;
            renderBall(canvas, assetsA, s.flag, s.expr, s.lx, s.ly);
        }
        async function drawBall(canvas, country, opts) {
            const prev = canvas._pb;
            const s = canvas._pb = {
                country, expr: (opts && opts.expr) || 'normal', lx: prev ? prev.lx : 0, ly: prev ? prev.ly : 0,
                flag: country.id === 'pl' ? 'poland' : (flagImgs.get(country.id) || null)
            };
            liveBalls.add(canvas);
            const A = await getAssets();
            if (!A.ok) {
                if (!assetErrShown) { assetErrShown = true; showDialog('ボール画像を読み込めませんでした', '通信状態を確認して、ページを再読み込みしてね。', 'fa-triangle-exclamation'); }
                return false;
            }
            assetsA = A;
            if (canvas._pb !== s) return false;
            refreshBall(canvas);
            if (!s.flag) {
                const f = await getFlag(country);
                if (f) { flagImgs.set(country.id, f); if (canvas._pb === s) { s.flag = f; refreshBall(canvas); } }
            }
            return true;
        }
        function setBallExpr(canvas, expr) { if (canvas && canvas._pb) { canvas._pb.expr = expr; refreshBall(canvas); } }
        function makeBallCanvas(country, cls, expr) {
            const c = document.createElement('canvas'); c.width = c.height = 220; if (cls) c.className = cls;
            drawBall(c, country, { expr }); return c;
        }

        /* 触れた方向を見る(目と旗を少しずらして、ちょっと振り返る) */
        let lookPt = null, lookDown = false, lookHold = 0, lookRaf = null;
        function lookStep(now) {
            lookRaf = null;
            if (lookPt && !lookDown && now > lookHold) lookPt = null;
            let busy = !!lookPt, n = 0;
            const vw = innerWidth, vh = innerHeight;
            for (const c of liveBalls) {
                if (!c.isConnected) { liveBalls.delete(c); continue; }
                const s = c._pb; if (!s || n >= 40) continue;
                const r = c.getBoundingClientRect();
                if (r.width < 4 || r.bottom < 0 || r.top > vh || r.right < 0 || r.left > vw) continue;
                if (c.closest('.state-hidden')) continue;
                let tx = 0, ty = 0;
                if (lookPt) {
                    const dx = lookPt.x - (r.left + r.width / 2), dy = lookPt.y - (r.top + r.height / 2);
                    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 140);
                    tx = dx / d * k; ty = dy / d * k;
                }
                const nx = s.lx + (tx - s.lx) * 0.2, ny = s.ly + (ty - s.ly) * 0.2;
                if (Math.abs(nx - s.lx) > 0.005 || Math.abs(ny - s.ly) > 0.005) { s.lx = nx; s.ly = ny; refreshBall(c); busy = true; n++; }
            }
            if (busy) lookRaf = requestAnimationFrame(lookStep);
        }
        function lookKick() { if (!lookRaf) lookRaf = requestAnimationFrame(lookStep); }
        window.addEventListener('pointerdown', e => { lookPt = { x: e.clientX, y: e.clientY }; lookDown = true; lookKick(); }, true);
        window.addEventListener('pointermove', e => { if (lookDown) { lookPt = { x: e.clientX, y: e.clientY }; lookKick(); } }, true);
        const lookEnd = () => { lookDown = false; lookHold = performance.now() + 700; lookKick(); };
        window.addEventListener('pointerup', lookEnd, true);
        window.addEventListener('pointercancel', lookEnd, true);

        const CAUGHT_DIALOGUES = [

        /* =================================================================
           2. INDEXED DB CONTROLLER
           ================================================================= */
        class DBController {
            constructor() {
                this.dbName = 'RingDeutschlandDB';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('caught_balls')) {
                            db.createObjectStore('caught_balls', { keyPath: 'key' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    request.onerror = (e) => reject(e);
                });
            }

            async saveBall(countryId) {
                if (!this.db) return;
                const key = countryId;
                const item = {
                    key: key,
                    countryId: countryId,
                    caughtAt: new Date().toISOString()
                };
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('caught_balls', 'readwrite');
                    const store = tx.objectStore('caught_balls');
                    const request = store.put(item);
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(false);
                });
            }

            async getCaughtBalls() {
                if (!this.db) return [];
                return new Promise((resolve) => {
                    const tx = this.db.transaction('caught_balls', 'readonly');
                    const store = tx.objectStore('caught_balls');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => resolve([]);
                });
            }

            async isCaught(countryId) {
                if (!this.db) return false;
                const key = countryId;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('caught_balls', 'readonly');
                    const store = tx.objectStore('caught_balls');
                    const request = store.get(key);
                    request.onsuccess = () => resolve(!!request.result);
                    request.onerror = () => resolve(false);
                });
            }
        }

        const dbCtrl = new DBController();

        }

        document.getElementById('btn-dialog-ok').addEventListener('click', () => {
            document.getElementById('dialog-modal').classList.add('hidden');
        });

        /* =================================================================
           4. START SCREEN & FLOATING ANIMATIONS
           ================================================================= */
        function initStartScreen() {
            const container = document.getElementById('floating-balls-bg');
            container.innerHTML = '';
            drawBall(byId('start-ball'), COUNTRIES.find(c => c.id === 'de'));
            
            // Generate 12 random floating balls
            for (let i = 0; i < 12; i++) {
                const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
                const img = makeBallCanvas(country, 'floating-ball', EXPRS[Math.floor(Math.random() * EXPRS.length)]);

                const size = 40 + Math.random() * 50;
                img.style.width = `${size}px`;
                img.style.height = `${size}px`;
                img.style.left = `${Math.random() * 90}%`;
                img.style.top = `${Math.random() * 90}%`;
                img.style.animationDuration = `${8 + Math.random() * 10}s`;
                img.style.animationDelay = `${Math.random() * 5}s`;

                container.appendChild(img);
            }
        }

        /* =================================================================
           5. 3D BIRD'S EYE MAP ENGINE (軽量化・安定版)
           ================================================================= */
        const byId = (id) => document.getElementById(id);
        const rand = (a, b) => a + Math.random() * (b - a);

        /* ★ 調整用の設定値 (距離はすべてメートル) */
        const CFG = {
            TILT: 50,            // マップの傾き
            CENTER_Y: 0.62,      // 自分の位置(画面の縦位置 0~1)
            CELL_DEG: 0.015,     // 1マスの大きさ(約1.7km四方)
            STATION_BOOST: 0.12,  // 駅があるマスは出現率がほんの少しだけ上がる(確実ではない)
            SPAWN_PROB: 0.6,     // 1マスにボールがいる確率(約1〜2kmに1体)
            EPOCH_HOURS: 12,     // この時間ごとにボールの配置が入れ替わる
            HINT_R: 120,         // この距離で「影」が見える
            REVEAL_R: 45,        // この距離で姿がはっきり見える
            CATCH_R: 25          // この距離以内でタップして捕獲開始
        };

        /* 捕まえる難しさ (出現時にランダムで決定) */
        const DIFFS = [
            { stars: 1, label: 'やさしい',   speed: [2.5, 3.5], margin: 56, erratic: 0,     w: 45 },
            { stars: 2, label: 'ふつう',     speed: [3.5, 5.0], margin: 44, erratic: 0.004, w: 30 },
            { stars: 3, label: 'むずかしい', speed: [5.0, 6.5], margin: 34, erratic: 0.010, w: 18 },
            { stars: 4, label: 'げきむず',   speed: [6.5, 8.5], margin: 26, erratic: 0.018, w: 7 }
        ];
        function pickDiff() {
            let r = Math.random() * 100;
            for (const d of DIFFS) { if ((r -= d.w) < 0) return d; }
            return DIFFS[0];
        }

        let userAcc = 0, gotFix = false, demoMode = false;
        let viewPos = null, followRaf = null, playerCircle = null;
        let nextBallId = 1, lastMaintain = 0, watchId = null, toastTimer = null;

        function showToast(text, icon = 'fa-circle-info') {
            const t = byId('toast');
            t.innerHTML = `<i class="fa-solid ${icon} text-yellow-300"></i><span></span>`;
            t.lastChild.textContent = text;
            t.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
        }

        /* 傾けたマップが画面をちょうど覆うサイズに調整(大きすぎると描画が崩れる) */
        function layoutMap() {
            const vp = byId('viewport-container');
            const w = vp.clientWidth, h = vp.clientHeight;
            const S = Math.round(Math.max(1900, w * 1.9, h * 2.2));
            const wr = byId('map-oversized-wrapper');
            wr.style.width = wr.style.height = S + 'px';
            wr.style.left = (w / 2 - S / 2) + 'px';
            wr.style.top = (h * CFG.CENTER_Y - S / 2) + 'px';
            vp.style.perspectiveOrigin = `50% ${CFG.CENTER_Y * 100}%`;
            if (map) map.invalidateSize({ animate: false });
        }
        window.addEventListener('resize', layoutMap);

        function initMap() {
            if (map) return;
            layoutMap();

            map = L.map('leaflet-map', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,
                touchZoom: false,
                doubleClickZoom: false,
                scrollWheelZoom: false,
                boxZoom: false,
                keyboard: false,
                inertia: false,
                fadeAnimation: false,
                zoomAnimation: false,
                markerZoomAnimation: false,
                zoomSnap: 0.5,
                zoomDelta: 0.5
            }).setView([userLat, userLng], mapZoom);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                minZoom: 14,
                subdomains: ['a', 'b', 'c'],
                keepBuffer: 2,
                updateWhenIdle: false,
                updateWhenZooming: false,
                updateInterval: 150
            }).addTo(map);

            const playerIcon = L.divIcon({
                className: 'custom-player-marker',
                html: `
                    <div class="upright" style="transform-origin:50% 50%">
                        <div class="relative w-16 h-16 flex items-center justify-center">
                            <div class="player-pulse"></div>
                            <div class="ball-img-wrapper z-10">
                                <canvas class="player-canvas" width="220" height="220"></canvas>
                            </div>
                        </div>
                    </div>`,
                iconSize: [64, 64],
                iconAnchor: [32, 32]
            });
            playerMarker = L.marker([userLat, userLng], { icon: playerIcon, zIndexOffset: 1000, interactive: false }).addTo(map);
            playerCircle = L.circle([userLat, userLng], {
                radius: CFG.REVEAL_R, color: '#f59e0b', weight: 2, dashArray: '6 6',
                fillColor: '#fbbf24', fillOpacity: 0.12, interactive: false
            }).addTo(map);

            const pc = playerMarker.getElement().querySelector('.player-canvas');
            if (pc) drawBall(pc, COUNTRIES.find(c => c.id === 'de'));
            update3DTransform();
        }

        /* 傾き + 回転。ボールは回転に合わせて常に正面を向く(--hd を使用) */
        function update3DTransform() {
            const wr = byId('map-oversized-wrapper');
            if (!wr) return;
            wr.style.setProperty('--hd', mapHeading + 'deg');
            wr.style.transform = `rotateX(${CFG.TILT}deg) rotateZ(${mapHeading}deg)`;
        }

        byId('btn-zoom-in').addEventListener('click', () => {
            if (map && mapZoom < 19) { mapZoom += 0.5; map.setZoom(mapZoom, { animate: false }); }
        });
        byId('btn-zoom-out').addEventListener('click', () => {
            if (map && mapZoom > 15) { mapZoom -= 0.5; map.setZoom(mapZoom, { animate: false }); }
        });
        byId('btn-rotate-left').addEventListener('click', () => { mapHeading -= 45; update3DTransform(); });
        byId('btn-rotate-right').addEventListener('click', () => { mapHeading += 45; update3DTransform(); });

        /* ---- 自分の位置を滑らかに追従(panToのアニメ連打をやめて軽量化) ---- */
        function applyView() {
            const ll = [viewPos.lat, viewPos.lng];
            playerMarker.setLatLng(ll);
            playerCircle.setLatLng(ll);
            map.panTo(ll, { animate: false, noMoveStart: true });
        }

        function followStep() {
            followRaf = null;
            const dLat = userLat - viewPos.lat, dLng = userLng - viewPos.lng;
            if (Math.abs(dLat) < 2e-8 && Math.abs(dLng) < 2e-8) {
                viewPos = { lat: userLat, lng: userLng };
                applyView();
                return;
            }
            viewPos.lat += dLat * 0.15;
            viewPos.lng += dLng * 0.15;
            applyView();
            followRaf = requestAnimationFrame(followStep);
        }

        function setPlayerPos(lat, lng, snap) {
            userLat = lat; userLng = lng;
            if (!map) return;
            if (snap || !viewPos) {
                viewPos = { lat, lng };
                playerMarker.setLatLng([lat, lng]);
                playerCircle.setLatLng([lat, lng]);
                map.setView([lat, lng], mapZoom, { animate: false });
                return;
            }
            // 遠くまで歩いてピクセル座標が膨らんだら基準点をリセット(表示崩れ対策)
            const off = map.project(map.getCenter()).distanceTo(map.getPixelOrigin().add(map.getSize().divideBy(2)));
            if (off > 2500) {
                viewPos = { lat, lng };
                playerMarker.setLatLng([lat, lng]);
                playerCircle.setLatLng([lat, lng]);
                map.setView([lat, lng], mapZoom, { reset: true, animate: false });
                return;
            }
            if (!followRaf) followRaf = requestAnimationFrame(followStep);
        }

        /* Haversine Formula for exact distance calculation in meters */
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        /* =================================================================
           6. BALL SPAWNING (現在地を中心にまばら / 見つけにくい)
           ================================================================= */
        function catchRadius() {
            // GPS誤差が大きいときは少しだけ判定をゆるめる
            return Math.max(CFG.CATCH_R, Math.min(userAcc || 0, 60));
        }

        /* 世界を約1.7km四方の「マス」に分け、マスごとにボールがいるかを決める。
           同じ場所・同じ時間帯なら再読み込みしても同じ結果になる(リロードで増えない) */
        function hashStr(s) {
            let h = 1779033703 ^ s.length;
            for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
            return h >>> 0;
        }
        function seededRng(seed) {
            let a = seed;
            return () => {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const lngStepAt = (row) => CFG.CELL_DEG / Math.max(0.2, Math.cos((row + 0.5) * CFG.CELL_DEG * Math.PI / 180));
        const currentEpoch = () => Math.floor(Date.now() / (CFG.EPOCH_HOURS * 3600000));
        let caughtCells = new Set();
        try { caughtCells = new Set(JSON.parse(localStorage.getItem('ringde_cells') || '[]')); } catch (e) {}
        function saveCells() {
            try { localStorage.setItem('ringde_cells', JSON.stringify([...caughtCells].slice(-300))); } catch (e) {}
        }

        function cellBall(row, col, epoch) {
            const cellId = `${row}:${col}:${epoch}`;
            if (caughtCells.has(cellId)) return { cellId, data: null };
            const rng = seededRng(hashStr(cellId));
            const st = stationCells.get(row + ':' + col);
            if (rng() > CFG.SPAWN_PROB + (st ? CFG.STATION_BOOST : 0)) return { cellId, data: null };
            let lat = (row + 0.1 + rng() * 0.8) * CFG.CELL_DEG;
            let lng = (col + 0.1 + rng() * 0.8) * lngStepAt(row);
            if (st && rng() < 0.5) { // 半分くらいは駅の近く(80〜300m)に出る
                const sp = st[Math.floor(rng() * st.length)], a = rng() * Math.PI * 2, r = 80 + rng() * 220;
                lat = sp[0] + r * Math.cos(a) / 111000;
                lng = sp[1] + r * Math.sin(a) / (111000 * Math.cos(sp[0] * Math.PI / 180));
            }
            let c;
            for (let i = 0; i < 8; i++) {
                c = COUNTRIES[Math.floor(rng() * COUNTRIES.length)];
                if (!caughtKeysSet.has(c.id)) break;
            }
            const key = c.id;
            let r = rng() * 100, diff = DIFFS[0];
            for (const d of DIFFS) { if ((r -= d.w) < 0) { diff = d; break; } }
            let rr = rng() * 100, expr = 'normal';
            for (const [k, w] of EXPR_WEIGHTS) { if ((rr -= w) < 0) { expr = k; break; } }
            return { cellId, data: { cellId, country: c, key, lat, lng, diff, expr } };
        }

        function addBall(data) {
            const id = nextBallId++;
            const icon = L.divIcon({
                className: 'ball-leaflet-icon state-hidden',
                html: `
                    <div class="ball-marker-container upright" id="ball-marker-${id}">
                        <div class="ball-img-wrapper">
                            <canvas width="220" height="220"></canvas>
                            <span class="ball-q">?</span>
                        </div>
                        <div class="ball-shadow"></div>
                    </div>`,
                iconSize: [64, 76],
                iconAnchor: [32, 68]
            });
            const marker = L.marker([data.lat, data.lng], { icon }).addTo(map);
            const cv = marker.getElement().querySelector('canvas');
            if (cv) drawBall(cv, data.country, { expr: data.expr });
            const ball = { id, ...data, marker, state: 0, hinted: false };
            marker.on('click', () => handleBallClick(ball));
            spawnedBalls.push(ball);
        }

        function removeBall(ball) {
            clearMark(ball);
            if (map && ball.marker) map.removeLayer(ball.marker);
            spawnedBalls = spawnedBalls.filter(b => b !== ball);
        }

        /* 周囲3x3マスだけを読み込み、離れたマスのボールは消す */
        function maintainBalls() {
            if (!map || !gotFix) return;
            ensureStations();
            const epoch = currentEpoch();
            const row0 = Math.floor(userLat / CFG.CELL_DEG);
            const wanted = new Set();
            for (let dr = -1; dr <= 1; dr++) {
                const row = row0 + dr;
                const col0 = Math.floor(userLng / lngStepAt(row));
                for (let dc = -1; dc <= 1; dc++) {
                    const { cellId, data } = cellBall(row, col0 + dc, epoch);
                    wanted.add(cellId);
                    if (data && !spawnedBalls.some(b => b.cellId === cellId)) addBall(data);
                }
            }
            spawnedBalls.slice().forEach(b => {
                if (b !== activeThrowBall && !wanted.has(b.cellId)) removeBall(b);
            });
        }

        /* 距離に応じて「見えない → 影 → 姿が見える」 */
        function updateBallStates() {
            if (!map) return;
            const revealR = Math.max(CFG.REVEAL_R, catchRadius() + 10);
            spawnedBalls.forEach(b => {
                const d = getDistanceInMeters(userLat, userLng, b.lat, b.lng);
                const s = d <= revealR ? 2 : d <= CFG.HINT_R ? 1 : 0;
                if (s === b.state) return;
                const prev = b.state;
                b.state = s;
                const el = b.marker.getElement();
                if (el) {
                    el.classList.toggle('state-hidden', s === 0);
                    el.classList.toggle('state-hint', s === 1);
                }
                if (s === 2 && prev < 2) showToast(`${b.country.flag} ${b.country.name}ボールを見つけた！`, 'fa-star');
                else if (s === 1 && prev === 0 && !b.hinted) { b.hinted = true; showToast('近くにボールのかげが…！', 'fa-eye'); }
            });
        }

        /* 「あったかメーター」(方向は教えない) */
        function updateRadar() {
            let nearest = Infinity;
            spawnedBalls.forEach(b => {
                if (caughtKeysSet.has(b.key)) return;
                nearest = Math.min(nearest, getDistanceInMeters(userLat, userLng, b.lat, b.lng));
            });
            let icon = '🧭', msg = 'ボールをさがしています…', pct = 0;
            if (nearest === Infinity) { /* そのまま */ }
            else if (nearest > 1500) { icon = '❄️'; msg = 'ボールの気配なし。遠くまで歩いてさがそう！'; pct = 5; }
            else if (nearest > 600) { icon = '🌥️'; msg = 'どこかにいるかも…気配はまだ遠いよ'; pct = 20; }
            else if (nearest > 250) { icon = '🌤️'; msg = '気配がしてきたよ！'; pct = 40; }
            else if (nearest > CFG.HINT_R) { icon = '🌤️'; msg = 'けっこう近い！もう少し！'; pct = 60; }
            else if (nearest > CFG.REVEAL_R) { icon = '🔥'; msg = 'かなり近い！ぼんやり影が見えるよ'; pct = 80; }
            else { icon = '✨'; msg = 'すぐそこ！ボールをタップしてね'; pct = 100; }
            byId('radar-icon').innerText = icon;
            byId('radar-msg').innerText = msg;
            byId('radar-bar').style.width = pct + '%';
        }

        function afterMove(force) {
            if (typeof nbOpen !== 'undefined' && nbOpen) renderNearby(false);
            updateBallStates();
            const now = Date.now();
            if (force || now - lastMaintain > 3000) {
                lastMaintain = now;
                maintainBalls();
                updateBallStates();
            }
            updateRadar();
        }

        /* Handle Clicking a Polandball on the Map */
        function handleBallClick(ball) {
            if (caughtKeysSet.has(ball.key)) {
                if (ball.state === 2) showBallSpeechBubble(ball);
                else showToast('もう仲間のボールだよ。近づいてみよう！', 'fa-face-smile');
                return;
            }
            if (ball.state < 2) {
                showToast('まだぼんやり…もっと近づいてみよう！', 'fa-eye');
                return;
            }
            const d = getDistanceInMeters(userLat, userLng, ball.lat, ball.lng);
            const r = catchRadius();
            if (d > r) {
                showToast(`あと約${Math.max(1, Math.round(d - r))}m！ もう少し近づいてタップしてね`, 'fa-person-walking');
                return;
            }
            startThrowGame(ball);
        }

        /* Show Speech Bubble for Already Caught Balls */
        function showBallSpeechBubble(ball) {
            const root = ball.marker.getElement();
            const el = root && root.querySelector('.ball-marker-container');
            if (!el) return;
            const prev = el.querySelector('.speech-bubble');
            if (prev) prev.remove();

            const bubble = document.createElement('div');
            bubble.className = 'speech-bubble';
            bubble.innerText = CAUGHT_DIALOGUES[Math.floor(Math.random() * CAUGHT_DIALOGUES.length)];
            el.appendChild(bubble);
            setTimeout(() => bubble.remove(), 3000);
        }

        /* =================================================================
           7. REAL GPS GEOLOCATION TRACKING
           ================================================================= */
        function setGps(text) { byId('gps-status').innerText = text; }

        function onPosition(pos) {
            const { latitude, longitude, accuracy } = pos.coords;
            if (gotFix && accuracy > 120) return; // 精度が悪すぎる値は無視(ワープ対策)
            userAcc = accuracy || 0;
            const first = !gotFix;
            const jump = first ? Infinity : getDistanceInMeters(userLat, userLng, latitude, longitude);
            gotFix = true;
            setPlayerPos(latitude, longitude, jump > 200);
            setGps(userAcc > 50 ? `GPSやや不安定 (±${Math.round(userAcc)}m)` : `GPS良好 (±${Math.round(userAcc)}m)`);
            if (first) {
                byId('loading-overlay').classList.add('hidden');
                
                showToast('さんぽスタート！歩いてボールをさがそう', 'fa-person-walking');
                afterMove(true);
            } else {
                afterMove(false);
            }
        }

        function showLoadingActions(msg) {
            if (msg) byId('loading-msg').innerText = msg;
            byId('loading-actions').classList.remove('hidden');
        }

        function onGpsError(err) {
            console.warn('Geolocation Error:', err);
            if (!gotFix) {
                showLoadingActions(err && err.code === 1
                    ? '位置情報の許可がオフになっているよ。ブラウザの設定で許可してね'
                    : 'うまく現在地が取れないみたい…');
            } else {
                setGps('GPS取得待機中…');
            }
        }

        function startGeolocationTracking() {
            if (demoMode) return;
            if (!navigator.geolocation) {
                showLoadingActions('このブラウザはGPSに対応していないよ');
                return;
            }
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            byId('loading-msg').innerText = '現在地をさがしているよ…';
            byId('loading-actions').classList.add('hidden');
            setGps('GPSをさがし中…');
            watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, {
                enableHighAccuracy: true, maximumAge: 1000, timeout: 20000
            });
            setTimeout(() => { if (!gotFix) showLoadingActions(); }, 8000);
        }

        /* デモモード: GPSなしでも遊べる(ベルリン / 矢印キーか十字ボタンで移動) */
        function enterDemoMode() {
            demoMode = true;
            if (watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            userAcc = 5;
            gotFix = true;
            setPlayerPos(52.5200, 13.4050, true);
            setGps('デモモード (十字ボタン/矢印キーで移動)');
            byId('loading-overlay').classList.add('hidden');
            byId('dpad').classList.remove('hidden');
            
            afterMove(true);
        }

        function demoStep(dx, dy) {
            if (!demoMode) return;
            const step = 120; // 1回120m(ボールがまばらなので大きめ)
            setPlayerPos(userLat + (dy * step) / 111000,
                         userLng + (dx * step) / (111000 * Math.cos(userLat * Math.PI / 180)), false);
            afterMove(false);
        }

        byId('btn-retry').addEventListener('click', startGeolocationTracking);
        byId('btn-demo').addEventListener('click', enterDemoMode);
        document.querySelectorAll('#dpad button').forEach(btn => {
            btn.addEventListener('click', () => {
                const [dx, dy] = btn.dataset.d.split(',').map(Number);
                demoStep(dx, dy);
            });
        });
        window.addEventListener('keydown', (e) => {
            const m = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
            if (m && demoMode) { e.preventDefault(); demoStep(m[0], m[1]); }
        });

        /* =================================================================
           8. DE-RING THROW MINI-GAME LOGIC
           ================================================================= */
        const throwRing = byId('throw-ring');
        const ringArea = byId('ring-touch-area');
        let isThrowing = false;
        let targetX = 0, targetDirection = 1, targetSpeed = 3, targetAnimReq = null, lastTs = 0;
        let curDiff = DIFFS[0], speedBoost = 1, throwSession = 0;
        let dragStartY = null, dragDy = 0;

        function animateTargetBall(ts) {
            const dt = Math.min(48, ts - (lastTs || ts));
            lastTs = ts;
            const k = dt / 16.67; // 画面のリフレッシュレートに依存しない速度
            const containerWidth = byId('target-area').clientWidth || 300;
            const maxOffset = Math.min(120, containerWidth / 2 - 40);

            // 難しいボールは急に反転/加速する
            if (curDiff.erratic && Math.random() < curDiff.erratic * k) {
                if (Math.random() < 0.5) targetDirection *= -1;
                else targetSpeed = rand(curDiff.speed[0], curDiff.speed[1]) * speedBoost;
            }

            targetX += targetSpeed * targetDirection * k;
            if (targetX > maxOffset) { targetX = maxOffset; targetDirection = -1; }
            else if (targetX < -maxOffset) { targetX = -maxOffset; targetDirection = 1; }

            const box = byId('target-ball-box');
            if (box) box.style.transform = `translateX(${targetX}px)`;
            targetAnimReq = requestAnimationFrame(animateTargetBall);
        }

        function stopTargetBallAnimation() {
            if (targetAnimReq) { cancelAnimationFrame(targetAnimReq); targetAnimReq = null; }
        }

        function resetRing() {
            throwRing.style.transition = 'transform 0.15s ease-out';
            throwRing.style.transform = 'translateY(0px) scale(1)';
        }

        function startThrowGame(ball) {
            activeThrowBall = ball;
            throwSession++;
            curDiff = ball.diff;
            speedBoost = 1;

            byId('target-country-name').innerText = `${ball.country.flag} ${ball.country.name}`;
            byId('target-ball-title').innerText = `${ball.country.name}ボールが現れた！`;
            byId('throw-stars').innerText = `むずかしさ ${'★'.repeat(curDiff.stars)}${'☆'.repeat(4 - curDiff.stars)} ${curDiff.label}`;
            byId('target-band').style.width = (curDiff.margin * 2) + 'px';

            const tc = byId('target-ball-canvas');
            tc.getContext('2d').clearRect(0, 0, tc.width, tc.height);
            drawBall(tc, ball.country, { expr: ball.expr });

            throwRing.style.transition = 'none';
            throwRing.style.transform = 'translateY(0px) scale(1)';
            byId('catch-msg').classList.add('hidden');
            byId('miss-msg').classList.add('hidden');
            byId('target-img-container').style.transform = 'scale(1) rotate(0deg)';
            byId('throw-hint').innerText = 'ボールが点線の中に来たら、リングを上へスワイプ！(タップでもOK)';

            targetSpeed = rand(curDiff.speed[0], curDiff.speed[1]);
            targetX = 0;
            targetDirection = Math.random() > 0.5 ? 1 : -1;
            lastTs = 0;

            stopTargetBallAnimation();
            targetAnimReq = requestAnimationFrame(animateTargetBall);

            byId('throw-screen').classList.remove('hidden');
            isThrowing = false;
        }

        function executeThrowAnimation() {
            if (isThrowing || !activeThrowBall) return;
            isThrowing = true;
            const s = throwSession;
            const ball = activeThrowBall;
            byId('throw-hint').innerText = 'それっ！';

            throwRing.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
            throwRing.style.transform = 'translateY(-320px) scale(0.55)';

            setTimeout(async () => {
                if (s !== throwSession) return;
                const off = Math.abs(targetX);

                if (off <= curDiff.margin) {
                    stopTargetBallAnimation();
                    byId('catch-msg').classList.remove('hidden');
                    byId('target-img-container').style.transform = 'scale(1.15) rotate(10deg)';
                    setBallExpr(byId('target-ball-canvas'), 'smile');

                    caughtKeysSet.add(ball.key);
                    caughtCells.add(ball.cellId); saveCells();
                    updateZukanBadge();
                    try { await dbCtrl.saveBall(ball.country.id); } catch (e) { console.warn(e); }

                    setTimeout(() => {
                        if (s !== throwSession) return;
                        stopThrowGame();
                        removeBall(ball);
                        afterMove(true);
                        showDialog(
                            'ゲット大成功！',
                            `${ball.country.name}ボールが仲間になったんよ！`,
                            'fa-circle-check'
                        );
                    }, 1200);
                } else {
                    byId('miss-msg').innerText = off <= curDiff.margin * 1.8 ? 'おしい！あとちょっと！' : 'ハズレ！';
                    byId('miss-msg').classList.remove('hidden');
                    setBallExpr(byId('target-ball-canvas'), curDiff.stars >= 3 ? 'anger' : 'lol');
                    byId('throw-hint').innerText = 'もう一度！タイミングを合わせて投げよう';
                    // むずかしいボールは外すたびに少し速くなる
                    if (curDiff.stars >= 3) {
                        speedBoost = Math.min(1.5, speedBoost * 1.08);
                        targetSpeed = Math.min(12, targetSpeed * 1.08);
                    }
                    setTimeout(() => {
                        if (s !== throwSession) return;
                        byId('miss-msg').classList.add('hidden');
                        setBallExpr(byId('target-ball-canvas'), ball.expr);
                        resetRing();
                        isThrowing = false;
                    }, 800);
                }
            }, 500);
        }

        function stopThrowGame() {
            throwSession++;
            stopTargetBallAnimation();
            isThrowing = false;
            dragStartY = null;
            activeThrowBall = null;
            byId('throw-screen').classList.add('hidden');
            byId('catch-msg').classList.add('hidden');
            byId('miss-msg').classList.add('hidden');
            byId('target-img-container').style.transform = 'scale(1) rotate(0deg)';
            throwRing.style.transition = 'transform 0.075s';
            throwRing.style.transform = 'translateY(0px) scale(1)';
        }

        /* リングのスワイプ操作(上にスワイプ or タップで投げる) */
        ringArea.addEventListener('pointerdown', (e) => {
            if (isThrowing) return;
            dragStartY = e.clientY;
            dragDy = 0;
            try { ringArea.setPointerCapture(e.pointerId); } catch (_) {}
            throwRing.style.transition = 'none';
        });
        ringArea.addEventListener('pointermove', (e) => {
            if (dragStartY === null || isThrowing) return;
            dragDy = dragStartY - e.clientY;
            const up = Math.max(0, Math.min(dragDy, 140));
            throwRing.style.transform = `translateY(${-up}px) scale(${1 - up / 400})`;
        });
        ringArea.addEventListener('pointerup', () => {
            if (dragStartY === null) return;
            const moved = dragDy;
            dragStartY = null;
            if (isThrowing) return;
            if (moved > 40 || Math.abs(moved) < 8) executeThrowAnimation();
            else resetRing();
        });
        ringArea.addEventListener('pointercancel', () => {
            dragStartY = null;
            if (!isThrowing) resetRing();
        });

        /* ---- 内部ユーティリティ ---- */
        (function () {
            const TUX = 'https://raw.githubusercontent.com/PolandBallHub-Operator/gn0mui-windows/refs/heads/main/linux_81610.ico';
            const DB_KEY = 'pbgo_countryballlist';
            const DB_FILE = 'countryballlist.db';

            const DB_DEFAULT = '# countryballlist.db\n# 1行1か国:  名前,旗画像URL(省略可)\n# # で始まる行はコメント\n';
            const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
            const dbGet = () => { try { const v = localStorage.getItem(DB_KEY); return v === null ? DB_DEFAULT : v; } catch (e) { return DB_DEFAULT; } };
            const dbSet = (v) => { try { localStorage.setItem(DB_KEY, v); return true; } catch (e) { return false; } };

            /* 1行ずつ解析: 名前,旗画像URL(省略可) */
            function parseDb(text) {
                const out = [];
                String(text).split('\n').forEach(raw => {
                    const line = raw.trim(); if (!line || line[0] === '#' || out.length >= 500) return;
                    const k = line.indexOf(',');
                    const name = (k < 0 ? line : line.slice(0, k)).trim().slice(0, 40);
                    let url = k < 0 ? '' : line.slice(k + 1).trim();
                    if (!/^https?:\/\//i.test(url)) url = '';
                    if (name) out.push({ name, url });
                });
                return out;
            }
            /* ファイルの内容を図鑑・出現リストへ反映 */
            function applyCustom() {
                for (let i = COUNTRIES.length - 1; i >= 0; i--) if (COUNTRIES[i].custom) COUNTRIES.splice(i, 1);
                let n = 0;
                parseDb(dbGet()).forEach(it => {
                    if (COUNTRIES.some(c => c.name === it.name)) return;
                    COUNTRIES.push({ id: 'c:' + it.name, name: it.name, region: 'custom', flag: '🏳️', custom: true, flagUrl: it.url });
                    n++;
                });
                return n;
            }
            applyCustom();

                    '<p class="m3-body">A shell is waiting on the other side of this window. Do you want to continue?</p>' +

                s.addEventListener('click', e => {
                    const a = e.target.dataset && e.target.dataset.a;

            }

            /* ---- 起動: 暗転 → 全画面 → ブートログ → デスクトップ ---- */
            let root = null, desk = null, z = 10, nWin = 0, menus = [];
            function startShell() {
                root = el('div'); root.id = 'sh-root'; document.body.appendChild(root);
                try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
                requestAnimationFrame(() => requestAnimationFrame(() => { root.style.opacity = '1'; }));
                setTimeout(boot, 900);
            }

            const LOG = [
                'Linux version 6.6.30-pbpark (gcc 13.2.0) #1 SMP PREEMPT',
                'Command line: BOOT_IMAGE=/boot/vmlinuz root=/dev/mmcblk0p2 rw',
                'BIOS-provided physical RAM map:',
                'x86/fpu: Supporting XSAVE feature 0x001: x87 floating point registers',

                'rcu: Hierarchical RCU implementation.',
                'clocksource: tsc: mask: 0xffffffffffffffff',
                'NET: Registered PF_INET protocol family',
                'PCI: Using configuration type 1 for base access',
                'usbcore: registered new interface driver usbhid',
                'EXT4-fs (mmcblk0p2): mounted filesystem with ordered data mode',
                'VFS: Mounted root (ext4 filesystem) on device 179:2.',
                'Freeing unused kernel image memory: 2048K',
                'Run /sbin/init as init process',
                'systemd[1]: Detected architecture x86-64.',

                'Starting twm ...'
            ];
            function boot() {
                if (!root) return;
                root.innerHTML = '';
                const wrap = el('div'); wrap.id = 'sh-boot';
                const img = new Image(); img.src = TUX; img.alt = '';
                const log = el('div'); log.className = 'sh-log';
                wrap.append(img, log); root.appendChild(wrap);
                let i = 0, t = 0;
                (function next() {
                    if (!root) return;
                    if (i >= LOG.length) { setTimeout(showDesktop, 500); return; }
                    const line = LOG[i++]; t += 0.01 + Math.random() * 0.3;
                    const d = el('div'); d.textContent = line.startsWith('[') ? line : `[${t.toFixed(6).padStart(12)}] ${line}`;
                    log.appendChild(d); log.scrollTop = log.scrollHeight;
                    setTimeout(next, 40 + Math.random() * 140);

            }

            function showDesktop() {
                if (!root) return;
                root.innerHTML = ''; closeMenus(); nWin = 0;
                desk = el('div'); desk.id = 'twm'; root.appendChild(desk);
                let pressTimer = null, sx = 0, sy = 0;
                desk.addEventListener('pointerdown', e => {
                    if (!e.target.closest('.twm-menu')) closeMenus();
                    if (e.target !== desk) return;
                    sx = e.clientX; sy = e.clientY;
                    clearTimeout(pressTimer);
                    pressTimer = setTimeout(() => showMenu('Menu', MAIN(), sx, sy, 0), 450);
                });
                const cancel = () => clearTimeout(pressTimer);
                desk.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
                desk.addEventListener('pointerup', cancel);
                desk.addEventListener('pointercancel', cancel);
                desk.addEventListener('contextmenu', e => { e.preventDefault(); if (e.target === desk && !menus.length) showMenu('Menu', MAIN(), e.clientX, e.clientY, 0); });
            }

            /* ---- メニュー ---- */
            function closeMenus() { menus.forEach(m => m.remove()); menus = []; }
            function showMenu(title, items, x, y, level) {
                while (menus.length > level) menus.pop().remove();
                const m = el('div', 'twm-menu'); const t = el('div', 't'); t.textContent = title; m.appendChild(t);

                const w = m.offsetWidth, h = m.offsetHeight;

            /* ---- ウィンドウ ---- */
            function mkWin(title, w, h) {
                const win = el('div', 'twm-win');
                const k = nWin++ % 4;
                win.style.cssText = `left:${8 + k * 16}px;top:${30 + k * 20}px;width:${w}px;height:${h}px;z-index:${++z}`;
                const bar = el('div', 'twm-title'), nm = el('span'), cl = el('div', 'twm-x');
                nm.textContent = title; cl.textContent = '×'; bar.append(nm, cl);
                const body = el('div', 'twm-body'); win.append(bar, body); desk.appendChild(win);
                win.addEventListener('pointerdown', () => { win.style.zIndex = ++z; });
                cl.addEventListener('pointerdown', e => e.stopPropagation());
                cl.addEventListener('click', () => win.remove());
                bar.addEventListener('pointerdown', e => {
                    if (e.target === cl) return;
                    const r0 = win.getBoundingClientRect(), ox = e.clientX - r0.left, oy = e.clientY - r0.top;
                    bar.setPointerCapture(e.pointerId);
                    const mv = ev => { win.style.left = Math.max(0, Math.min(ev.clientX - ox, innerWidth - 40)) + 'px'; win.style.top = Math.max(0, Math.min(ev.clientY - oy, innerHeight - 24)) + 'px'; };
                    const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); };
                    bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
                });
                return { win, body };
            }
            const WW = () => Math.min(innerWidth - 16, 440), HH = () => Math.min(innerHeight - 90, 380);

            function msgWin(title, text) {
                const { win, body } = mkWin(title, Math.min(innerWidth - 16, 260), 110);
                const p = el('div'); p.textContent = text; p.style.marginBottom = '10px';
                const b = el('button', 'twm-btn'); b.textContent = 'OK'; b.addEventListener('click', () => win.remove());
                body.append(p, b);
            }

            const MOCK = {
                'index.html': '<!DOCTYPE html>\n<html>\n<head><title>pbgo</title></head>\n<body>\n  <script src="game.js"><\/script>\n</body>\n</html>\n',
                'GameServer.java': 'public class GameServer {\n    public static void main(String[] args) {\n        System.out.println("pbgo server (mock)");\n    }\n}\n',
                'Spawner.java': 'public class Spawner {\n    // mock\n    static final int CELL = 1700;\n}\n',

                'config.json': '{\n  "name": "pbgo",\n  "mock": true\n}\n'
            };
            const DIRS = { '': ['server'], 'server': ['pbpark'], 'server/pbpark': ['pbgo'] };

            function openFileMan() {
                const { body } = mkWin('FileMan', WW(), HH());
                const bar = el('div'); bar.style.cssText = 'margin-bottom:4px;font-family:ui-monospace,monospace';

                let cwd = '';
                function render() {
                    bar.textContent = '/' + cwd; list.innerHTML = '';
                    const rows = [];
                    if (cwd) rows.push(['../', () => { cwd = cwd.split('/').slice(0, -1).join('/'); render(); }]);
                    (DIRS[cwd] || []).forEach(d => rows.push([d + '/', () => { cwd = cwd ? cwd + '/' + d : d; render(); }]));
                    if (cwd === PBGO) [DB_FILE, ...Object.keys(MOCK)].forEach(f => rows.push([f, () => openEditor(f)]));
                    rows.forEach(([label, fn]) => { const r = el('div', 'twm-row'); r.textContent = label; r.addEventListener('click', fn); list.appendChild(r); });

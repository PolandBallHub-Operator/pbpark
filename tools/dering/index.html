            function openEditor(file) {
                const isDb = file === DB_FILE, readOnly = !!file && !isDb;
                const { body } = mkWin(file || 'untitled', WW(), HH());
                body.style.cssText += ';display:flex;flex-direction:column';
                const ta = document.createElement('textarea'); ta.spellcheck = false; ta.style.flex = '1';
                ta.value = !file ? '' : isDb ? dbGet() : MOCK[file];
                const status = el('div'); status.style.cssText = 'font-size:11px;margin-top:4px;min-height:14px';
                const bar = el('div'); bar.style.marginTop = '4px';
                const save = el('button', 'twm-btn'); save.textContent = 'Save'; bar.appendChild(save);
                const deny = () => { status.style.color = '#a00'; status.textContent = 'Permission denied: 編集できません (read-only)'; };
                if (readOnly) { ta.readOnly = true; ta.addEventListener('focus', deny); }
                save.addEventListener('click', () => {
                    if (readOnly || !file) return deny();
                    if (!dbSet(ta.value)) { status.style.color = '#a00'; status.textContent = 'write error'; return; }
                    const n = applyCustom(); status.style.color = '#050'; status.textContent = `saved (${n})`;
                });
                body.append(ta, status, bar);
                if (isDb) { // 追加するボールのプレビュー
                    const pv = el('div');
                    pv.style.cssText = 'display:flex;gap:8px;overflow-x:auto;padding:6px 0;margin-top:4px;min-height:82px;border-top:1px solid #000;align-items:flex-start';
                    body.insertBefore(pv, status);
                    let tmr = null;
                    const renderPv = () => {
                        pv.innerHTML = '';
                        const items = parseDb(ta.value).slice(0, 40);
                        if (!items.length) { pv.style.fontSize = '11px'; pv.textContent = 'preview'; return; }
                        items.forEach(it => {
                            const box = el('div'); box.style.cssText = 'flex:0 0 64px;text-align:center;font-size:10px';
                            const c = makeBallCanvas({ id: 'pv:' + it.name + '|' + it.url, name: it.name, custom: true, region: 'custom', flag: '', flagUrl: it.url }, '', 'normal');
                            c.style.cssText = 'width:56px;height:56px;display:block;margin:0 auto';
                            const l = el('div'); l.textContent = it.name; l.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
                            box.append(c, l); pv.appendChild(box);
                        });
                    };
                    ta.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(renderPv, 600); });
                    renderPv();
                }
            }

            /* ---- ゲームへ戻る ---- */
            function exitShell() {
                closeMenus();
                if (root) root.remove(); root = null; desk = null;
                try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
                applyCustom();
                try {
                    if (map && gotFix) { spawnedBalls.slice().forEach(removeBall); afterMove(true); }
                    updateZukanBadge();
                } catch (e) { console.warn(e); }
            }
        })();
    
        /* ---- 付近のボール ---- */
        let nbOpen = false, nbLast = 0, nbSheet = null;
        function fmtDist(d) { return d < 1000 ? `約${Math.max(10, Math.round(d / 10) * 10)}m` : `約${(d / 1000).toFixed(1)}km`; }
        function renderNearby(force) {
            if (!nbSheet) return;
            const now = Date.now(); if (!force && now - nbLast < 4000) return; nbLast = now;
            const list = nbSheet.querySelector('.nb-list'); list.innerHTML = '';
            const items = spawnedBalls.map(b => ({ b, d: getDistanceInMeters(userLat, userLng, b.lat, b.lng) })).sort((x, y) => x.d - y.d);
            if (!items.length) { list.innerHTML = '<div class="nb-empty">近くにボールはいないみたい…<br>歩いてさがしてみよう</div>'; return; }
            items.forEach(({ b, d }) => {
                const got = caughtKeysSet.has(b.key);
                const row = document.createElement('div'); row.className = 'nb-row' + (got ? '' : ' nb-dark');
                const slot = document.createElement('div'); slot.className = 'nb-ball'; slot.appendChild(makeBallCanvas(b.country, '', b.expr));
                const info = document.createElement('div');
                const nm = document.createElement('div'); nm.className = 'nb-name'; nm.textContent = `${b.country.flag} ${b.country.name}`;
                const sub = document.createElement('div'); sub.className = 'nb-sub'; sub.textContent = `${fmtDist(d)}・${got ? '獲得ずみ' : '未獲得'}`;
                info.append(nm, sub); row.append(slot, info); row.style.cursor = 'pointer';
                row.addEventListener('click', () => { markBall(b); setNearby(false); });
                list.appendChild(row);
            });
        }
        function setNearby(open) {
            if (!nbSheet) {
                nbSheet = document.createElement('div'); nbSheet.className = 'nb-backdrop';
                nbSheet.innerHTML = '<div class="nb-panel"><div class="nb-head"><span>📡 付近のボール</span><button class="nb-close" aria-label="閉じる">✕</button></div><div class="nb-hint">ボールをタップすると、おおよその場所を60秒だけマークします</div><div class="nb-list"></div></div>';
                nbSheet.addEventListener('click', e => { if (e.target === nbSheet || e.target.closest('.nb-close')) setNearby(false); });
                document.body.appendChild(nbSheet);
            }
            nbOpen = open; nbSheet.style.display = open ? 'flex' : 'none';
            if (open) renderNearby(true);
        }
        document.getElementById('btn-nearby').addEventListener('click', () => setNearby(true));
    
        /* ---- ボールのおおよその場所を一時マーク ---- */
        const MARK_MS = 60000;
        const nbMarks = new Map();
        let markTimer = null;
        const DIR8 = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
        function bearingName(lat1, lng1, lat2, lng2) {
            const dy = lat2 - lat1, dx = (lng2 - lng1) * Math.cos(lat1 * Math.PI / 180);
            const deg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
            return DIR8[Math.round(deg / 45) % 8];
        }
        function markBall(ball) {
            if (!map) return;
            const d = getDistanceInMeters(userLat, userLng, ball.lat, ball.lng);
            const R = d < 600 ? 200 : d < 1500 ? 350 : 500;
            const rng = seededRng(hashStr('mk:' + ball.cellId)); // 同じボールは毎回同じ円(連打で絞り込めない)
            const ang = rng() * Math.PI * 2, off = rng() * 0.55 * R;
            const cLat = ball.lat + off * Math.cos(ang) / 111000;
            const cLng = ball.lng + off * Math.sin(ang) / (111000 * Math.cos(ball.lat * Math.PI / 180));
            const old = nbMarks.get(ball.id); if (old) map.removeLayer(old.circle);
            const circle = L.circle([cLat, cLng], { radius: R, color: '#ef4444', weight: 3, dashArray: '8 8', fillColor: '#f87171', fillOpacity: 0.15, interactive: false }).addTo(map);
            nbMarks.set(ball.id, { ball, circle, cLat, cLng, until: Date.now() + MARK_MS });
            if (!markTimer) markTimer = setInterval(markTick, 1000);
            renderChips();
            showToast(`${ball.country.name}ボールのおおよその場所をマークしたよ`, 'fa-location-dot');
        }
        function clearMark(ball) {
            const m = nbMarks.get(ball.id); if (!m) return;
            if (map) map.removeLayer(m.circle);
            nbMarks.delete(ball.id); renderChips();
        }
        function renderChips() {
            const box = document.getElementById('mark-chips'); if (!box) return;
            box.innerHTML = '';
            nbMarks.forEach(m => {
                const c = document.createElement('div'); c.className = 'mk-chip';
                const dist = getDistanceInMeters(userLat, userLng, m.cLat, m.cLng);
                c.textContent = `📍 ${m.ball.country.name}: ${bearingName(userLat, userLng, m.cLat, m.cLng)}へ${fmtDist(dist)} (あと${Math.max(0, Math.ceil((m.until - Date.now()) / 1000))}秒)`;
                box.appendChild(c);
            });
        }
        function markTick() {
            const now = Date.now();
            nbMarks.forEach(m => { if (now > m.until) clearMark(m.ball); });
            if (!nbMarks.size) { clearInterval(markTimer); markTimer = null; return; }
            renderChips();
        }

        /* ---- 駅の近くは、ほんの少しだけボールが出やすい(OpenStreetMapの駅データ) ---- */
        const stationCells = new Map();
        let stationTile = '', stationBusy = false, stationFailAt = 0;
        function addStationPoint(lat, lng) {
            const row = Math.floor(lat / CFG.CELL_DEG), col = Math.floor(lng / lngStepAt(row)), k = row + ':' + col;
            const arr = stationCells.get(k) || [];
            if (arr.length < 6 && !arr.some(p => Math.abs(p[0] - lat) < 1e-5 && Math.abs(p[1] - lng) < 1e-5)) arr.push([lat, lng]);
            stationCells.set(k, arr);
        }
        function readStationCache() { try { return JSON.parse(localStorage.getItem('ringde_stations') || '{}'); } catch (e) { return {}; } }
        (function () {
            const cache = readStationCache(), now = Date.now();
            Object.keys(cache).forEach(k => { if (cache[k] && now - cache[k].t < 7 * 864e5) (cache[k].p || []).forEach(p => addStationPoint(p[0], p[1])); });
        })();
        async function ensureStations() {
            if (!gotFix || stationBusy) return;
            const tile = Math.round(userLat / 0.03) + '_' + Math.round(userLng / 0.03);
            if (tile === stationTile || Date.now() - stationFailAt < 60000) return;
            const cache = readStationCache();
            if (cache[tile] && Date.now() - cache[tile].t < 7 * 864e5) { stationTile = tile; return; }
            stationBusy = true;
            try {
                const at = `(around:4500,${userLat.toFixed(4)},${userLng.toFixed(4)})`;
                const q = `[out:json][timeout:15];(node["railway"="station"]${at};node["railway"="halt"]${at};);out 400;`;
                const r = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q)
                });
                if (!r.ok) throw new Error('overpass ' + r.status);
                const d = await r.json();
                const pts = (d.elements || []).filter(e => typeof e.lat === 'number' && typeof e.lon === 'number')
                    .map(e => [Math.round(e.lat * 1e5) / 1e5, Math.round(e.lon * 1e5) / 1e5]).slice(0, 400);
                pts.forEach(p => addStationPoint(p[0], p[1]));
                cache[tile] = { t: Date.now(), p: pts };
                const keep = {}; Object.keys(cache).sort((a, b) => cache[b].t - cache[a].t).slice(0, 12).forEach(k => { keep[k] = cache[k]; });
                try { localStorage.setItem('ringde_stations', JSON.stringify(keep)); } catch (e) {}
                stationTile = tile;
                maintainBalls(); updateBallStates(); updateRadar();
            } catch (e) { stationFailAt = Date.now(); console.warn('station data', e); }
            stationBusy = false;
        }
    </script>
</body>
